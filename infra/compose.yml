# 项目名固定为 journeypilot，不跟目录名走：container_name 是固定值，而 compose
# 默认拿目录名当项目名 —— 仓库换个目录名就会撞名启动失败，数据卷也会换成另一个
# 项目名前缀。卷的实际名字见文末。
name: journeypilot

services:
  # ──────────────────────────────────────────────────────────
  # PostgreSQL + pgvector
  #
  # 默认档只承诺基础能力：PostgreSQL、pgvector、`simple` 词法检索，用官方镜像，
  # 不编译任何东西。让每个用户第一次启动都编译 SCWS + zhparser，换来的是一个在
  # ARM 上、在网络不好的地方、在 apt 源变动那天就装不上的产品。
  #
  # 中文分词增强（zhparser）是**换一个镜像**，不是第二个服务，也没有单独的
  # compose profile：同一个 postgres 服务用 POSTGRES_IMAGE 覆盖镜像即可。
  #
  #   docker build -t journeypilot-postgres:pg18-zhparser ./infra/postgres
  #   POSTGRES_IMAGE=journeypilot-postgres:pg18-zhparser docker compose -f infra/compose.yml up -d
  #
  # 同一个卷、同一个端口、同一个服务名 —— 它是同一个数据库的增强版本。生成列在
  # 建表时就固定了，已有库要切换分词需要重建数据库（或专门的重建迁移）；
  # `journeypilot doctor` 只报告 zhparser 扩展是否安装。
  # ──────────────────────────────────────────────────────────
  postgres:
    # 固定 digest 而不是只固定 tag：`pg18` 会被上游重新指向，而「同一份 compose
    # 在两台机器上起出两个不同的数据库版本」是没有任何读数能解释的一类故障。
    # 这是多架构 index 的 digest（含 linux/amd64 与 linux/arm64），所以两种机器
    # 拉的是同一份声明。换 digest 走 PR：它是一次依赖升级，不是一次配置微调。
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a}
    container_name: journeypilot-postgres
    environment:
      POSTGRES_DB: travel_agent
      POSTGRES_USER: travel_agent
      POSTGRES_PASSWORD: travel_agent_pwd
    ports:
      # 宿主机默认端口 55434；与应用配置使用同一个环境变量，便于本机并行运行多个数据库。
      - "${JOURNEYPILOT_DATABASE__PORT:-55434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_agent -d travel_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: journeypilot-redis
    ports:
      # 宿主机用 16379 而不是 6379，避免与本机其他 Redis 冲突。宿主侧应用连接
      # 这套栈时设置 JOURNEYPILOT_REDIS__PORT=16379。
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ──────────────────────────────────────────────────────────
  # JourneyPilot API
  # ──────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
      args:
        # 依赖分组：core 是默认交付面。要本地 Qwen Embedding 或 Cross Encoder
        # 的话在这里加组（见 backend/pyproject.toml 的 [dependency-groups]）。
        # 名字不带 JOURNEYPILOT_ 前缀：那个命名空间是严格的，认不出的名字会让
        # 容器在 `config validate` 就退出（同一份 .env 既可经 `--env-file .env`
        # 喂给插值，又经 env_file 整份进入容器）。
        DEPENDENCY_GROUPS: ${DEPENDENCY_GROUPS:-local-embedding}
    container_name: journeypilot-api
    ports:
      - "8001:8001"
    environment:
      # 统一前缀 JOURNEYPILOT_<段>__<字段>，一处解析（backend/travel_agent/config/env.py）。
      # 认不出的 JOURNEYPILOT_* 变量会让启动失败 —— 拼错一个字母不该静默无效。
      JOURNEYPILOT_DATABASE__HOST: postgres
      JOURNEYPILOT_DATABASE__PORT: "5432"
      JOURNEYPILOT_DATABASE__NAME: travel_agent
      JOURNEYPILOT_DATABASE__USER: travel_agent
      JOURNEYPILOT_DATABASE__PASSWORD: travel_agent_pwd
      JOURNEYPILOT_REDIS__HOST: redis
      JOURNEYPILOT_REDIS__PORT: "6379"
      JOURNEYPILOT_SERVER__HOST: "0.0.0.0"
      JOURNEYPILOT_SERVER__PORT: "8001"
      JOURNEYPILOT_SERVER__RELOAD: "false"
      JOURNEYPILOT_ENV: production
      # 本地 embedding 模型缓存（HF 自己的变量名，不是本仓的配置项）。
      HF_HOME: /home/journeypilot/.cache/huggingface
    env_file:
      # 可选：仓库根目录的 .env 整份传入容器，用来放 API key 等敏感信息。
      # 它只作用于容器环境；compose 自己的插值变量来自宿主 shell、infra/.env
      # 或 `--env-file` 指定的文件。
      - path: ../.env
        required: false
    volumes:
      - ../outputs:/app/outputs
      - ../uploads:/app/uploads
      - ../config.yaml:/app/config.yaml:ro
      - usage_data:/app/data/usage
      - backups_data:/app/backups
      - huggingface_cache:/home/journeypilot/.cache/huggingface
    # entrypoint 不含等待逻辑，空卷 initdb 要十几秒，靠 restart 重试等不到。
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 不用 unless-stopped：entrypoint 先迁移，被拒绝时以非零状态退出。重试三次足以
    # 吸收 Postgres 启动慢的情况；真正的拒绝则就此停下，原因留在
    # `docker compose -f infra/compose.yml logs api` 里，而不是陷入重启循环。
    restart: on-failure:3

# 卷键名固定为 postgres_data 等；项目名 journeypilot 会作为前缀，实际卷名是
# journeypilot_postgres_data 等。
volumes:
  postgres_data:
  redis_data:
  huggingface_cache:
  usage_data:
  backups_data:
