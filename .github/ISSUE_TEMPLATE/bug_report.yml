name: Bug report
description: 报告可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认问题可复现，并且日志/截图里没有 API Key、数据库口令或完整私有配置。
        安全问题不要在这里发，请按 SECURITY.md 私下报告。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 现象、期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 从哪个页面/命令开始，输入了什么
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node/Python 版本、启动方式（run.sh / Docker Compose）、使用的模型 Provider（不要贴 Key）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 相关日志片段或浏览器错误；提交前请脱敏
    validations:
      required: false
