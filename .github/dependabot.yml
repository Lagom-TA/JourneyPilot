# 依赖更新由 Dependabot 提 PR，而不是靠人记得去 bump。
#
# 每个生态每月最多一个分组 PR：把 minor/patch 放进同一个 PR，而不是十几个单包 PR ——
# 后者在一个只有一个人维护的仓库里等于没人看。上一个 PR 没处理完时不会再开新的。
# 语言包和镜像不提 major 升级，major 需要读 changelog 并配合代码迁移，由维护者手动发起；
# GitHub Actions 的 major 随分组一起提。
#
# Python 依赖由 uv 管理（backend/uv.lock），所以用 `uv` 生态而不是 `pip`。

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/backend/mcp"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      mcp-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
