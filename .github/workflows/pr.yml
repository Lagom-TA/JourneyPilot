name: PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # paths-filter 在 pull_request 事件里通过 API 读取变更文件。
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # 同一分支上更新的提交会取代尚未跑完的旧运行；手动触发的运行不被取消。
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  UV_VERSION: "0.9.7"
  PYTHON_VERSION: "3.11"

jobs:
  # 只跑受变更影响的作业：被跳过的作业在必需检查里算通过。手动触发时全部运行。
  # 工作流文件本身变化时，所有相关作业都运行。
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      mcp: ${{ steps.scope.outputs.mcp }}
      shell: ${{ steps.scope.outputs.shell }}
      image: ${{ steps.scope.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docs/configuration.md'
              - 'docs/config.schema.json'
              - '.github/actions/setup-backend/**'
              - '.github/workflows/pr.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/pr.yml'
            mcp:
              - 'backend/mcp/**'
              - '.github/workflows/pr.yml'
            shell:
              - '**/*.sh'
              - '.github/workflows/pr.yml'
            image:
              - 'backend/**'
              - 'frontend/**'
              - 'infra/**'
              - 'docs/configuration.md'
              - 'docs/config.schema.json'
              - 'README.md'
              - '.dockerignore'
              - '.github/workflows/pr.yml'
      - id: scope
        run: |
          {
            echo "backend=${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend }}"
            echo "frontend=${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend }}"
            echo "mcp=${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mcp }}"
            echo "shell=${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.shell }}"
            echo "image=${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.image }}"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    name: backend · lint + unit
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      # 字体缺失时 PDF 测试必须失败，而不是 skip：CI 装了字体，skip 就是门禁失效。
      JOURNEY_PDF_FONT_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      # 单元测试不依赖本地 embedding（ONNX）依赖组，只装 dev 组。
      - uses: ./.github/actions/setup-backend
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          groups: "--group dev"
          cjk-font: "true"
      - run: uv run --project backend ruff check --config backend/pyproject.toml backend/travel_agent/ backend/tests/ backend/scripts/
      - name: Configuration
        run: |
          uv run --project backend python backend/journeypilot.py config validate
          uv run --project backend python backend/journeypilot.py config docs --check
      - name: Unit tests and offline migrations
        run: |
          uv run --project backend pytest -c backend/pyproject.toml backend/tests/ --ignore=backend/tests/db -q
          uv run --project backend pytest -c backend/pyproject.toml backend/tests/db/test_offline_sql.py -q
      - name: Migrations have a single head
        # 两个 head 意味着 alembic 不知道该往哪走，而 `upgrade head` 会直接报错。
        # 这个检查只读迁移脚本目录，不连库。
        run: |
          heads=$(uv run --project backend alembic -c backend/alembic.ini heads)
          echo "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1

  node:
    name: node · frontend + mcp
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/mcp/package-lock.json
      - name: Frontend · type-check + lint + unit + build
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check
      # 这些 MCP server 由 npx 拉起，版本由 lockfile 决定。`npm ci` 是唯一能证明
      # 「lockfile 与 package.json 一致、且能装出来」的检查。
      - name: MCP · locked install + data module syntax
        if: needs.changes.outputs.mcp == 'true'
        run: |
          npm ci --prefix backend/mcp --no-audit --no-fund
          node --check backend/mcp/rail/station_name.js

  shell:
    name: shell · syntax + shellcheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install a pinned shellcheck
        # 用固定版本而不是 runner 自带的：本地验证与 CI 必须是同一个版本，
        # 否则「本机干净」不说明任何事。
        run: |
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: bash -n
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      - name: Check service supervision
        run: bash infra/scripts/supervise_harness.sh

  docker:
    name: docker · image + compose
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f infra/compose.yml config >/dev/null
      - uses: docker/setup-buildx-action@v3
      # 层缓存按 Dockerfile 各阶段分别命中：只改源码时，依赖安装层直接复用。
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/api.Dockerfile
          load: true
          tags: journeypilot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke checks
        run: |
          docker run --rm --entrypoint sh journeypilot-api:ci -ec '
            python backend/journeypilot.py config validate
            python backend/journeypilot.py config docs --check
            node --version | grep -E "^v22\."
            test -f /app/backend/static/index.html
            pg_dump --version
          '

  secrets:
    name: security · secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: The scanner still catches a planted key
        # 白名单收窄之后必须证明它没有把扫描器关掉：种一个合成密钥，扫描器必须
        # 报出来。
        #
        # 刻意**不用** AWS 文档里的示例 key（以 EXAMPLE 结尾的那个）：gitleaks 的
        # 默认规则自带 `.+EXAMPLE$` 的 allowlist，会放行它 —— 拿它做自检得到的
        # 是一个永远「通过」的假门禁。
        #
        # 这个值是随机合成的，只满足 aws-access-token 规则的形状（4 位前缀 + 16 位
        # `[A-Z2-7]`，熵 >= 3），不对应任何真实凭据。
        #
        # **运行期拼接，不写死字面量**：gitleaks-action 扫的是 git 历史
        # （`git log -p --full-history --all`），写死的字面量会让扫描器在仓库
        # 历史里命中这个测试夹具本身 —— 自检反而变成一次真实的「泄露」。
        # 相邻字符串字面量在 shell 里直接拼接，所以源码里不存在连续可匹配串；
        # 前缀也拆开，这样 `git log -p | grep <前缀>` 为空，可以机械地复核。
        run: |
          key="AK""IA""EYKH2CMZ5ML24UMD"
          printf 'aws_access_key_id = "%s"\n' "$key" > planted-secret.txt
          if docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
               detect --source /repo --no-git --config /repo/.gitleaks.toml --redact; then
            echo "::error::gitleaks did not flag a planted AWS key — the allowlist is too broad"
            exit 1
          fi
          rm -f planted-secret.txt

  backend-integration:
    name: backend · integration + migration (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: travel_agent
          POSTGRES_USER: travel_agent
          POSTGRES_PASSWORD: travel_agent_pwd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel_agent -d travel_agent"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      JOURNEYPILOT_DATABASE__HOST: 127.0.0.1
      JOURNEYPILOT_DATABASE__PORT: "5432"
      JOURNEYPILOT_DATABASE__NAME: travel_agent
      JOURNEYPILOT_DATABASE__USER: travel_agent
      JOURNEYPILOT_DATABASE__PASSWORD: travel_agent_pwd
      JOURNEYPILOT_REDIS__HOST: 127.0.0.1
      JOURNEYPILOT_REDIS__PORT: "6379"
      JP_TESTS_REQUIRE_POSTGRES: "1"
      JP_RUNTIME_ROLLBACK_TESTS: "1"
      JP_MEMORY_EXTRACTION_ROLLBACK_TESTS: "1"
      JP_MEMORY_LIFECYCLE_ROLLBACK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          groups: "--group local-embedding --group dev"
          postgres-client: "true"
          cjk-font: "true"
      - run: uv run --project backend python backend/journeypilot.py migrate --json
      - run: uv run --project backend python backend/journeypilot.py doctor --json
      - run: uv run --project backend pytest -c backend/pyproject.toml backend/tests/db -q
