# 降低误报噪音，让真实泄露保持可见。
# 真实生产密钥绝不允许出现在这里——只允许已 gitignore 的本地路径与
# 确定性测试夹具。

title = "JourneyPilot"

[extend]
# Keep default gitleaks rules (sk-*, cloud tokens, etc.).
useDefault = true

[allowlist]
description = "Local-only paths + known non-secret test fixtures"
paths = [
  # Local runtime secrets (already .gitignore'd; still hit by --no-git scans)
  '''(^|/)config\.yaml$''',
  '''(^|/)\.env(\..+)?$''',
  '''(^|/)cookies\.json$''',
  '''(^|/)secrets\..+$''',
  '''tests/test_formal_''',
]
regexes = [
  # Python 属性表达式会被通用规则误判成凭据。
  '''^reasoning_effort=self\._reasoning_effort$''',
]
