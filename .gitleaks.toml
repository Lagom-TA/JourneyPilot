# 降低误报噪音，让真实泄露保持可见。
#
# 这里**只允许**「确定不是凭据」的误报模式，不按路径放行。`config.yaml`、
# `.env*`、`cookies.json`、`secrets.*` 都已在 .gitignore 里，本来就不该被提交；
# 给它们开路径白名单只会让「有人 force-add 了一个带真 key 的 config.yaml」变成
# 静默通过 —— 而那种提交恰恰是最需要被拦下的。
#
# CI 的 secrets job 里有一个假密钥自检：种一个合成的、形如 AWS access key 的假
# 密钥，扫描器必须报出来（刻意不用 AWS 文档里的示例 key，见 pr.yml 中的说明）。
# 那份自检保证这份配置没有把扫描器关掉。

title = "JourneyPilot"

[extend]
# 保留 gitleaks 的默认规则（sk-*、云厂商令牌等）。
useDefault = true

[allowlist]
description = "只放行确定性的误报。"
regexes = [
  # Python 属性表达式会被通用规则误判成凭据。
  '''^reasoning_effort=self\._reasoning_effort$''',
]
