# JourneyPilot — Python 依赖由 uv 管理（见 uv.lock）
# 仓库根运行：uv sync --project backend && uv run --project backend python backend/main.py

[project]
name = "journeypilot"
version = "0.1.0"
description = "旅游规划智能体后端"
readme = "../README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # HTTP / 上传 / MCP 安全面的依赖设版本下限；langchain、langgraph、torch
    # 系列不盲目升大版本。
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.3",
    "python-multipart>=0.0.31",
    "sse-starlette>=2.3.6",
    "starlette>=0.47.2,<1",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres==3.0.5",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.85.0",
    "httpx>=0.27,<0.28",
    "urllib3>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.2.0",
    "greenlet>=1.0.0",
    "redis[hiredis]>=5.0.0",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.14.2",
    "pydantic-core>=2.33.2",
    "mcp>=1.9.4",
    "mcp-server-fetch",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.33.0",
    # PDF 导出与文档导入都是核心承诺（导出报告、上传资料是产品的两个按钮），
    # 所以它们留在 core。本地 embedding 与 cross encoder 不是，见 dependency-groups。
    "pypdf>=6.13.3",
    "reportlab>=4.4.0",
    "python-docx>=1.1.0",
    "ddgs>=9.14.3",
    # 版本化迁移：API 进程只读取 schema 状态；所有 DDL 都放在 migrations/versions/，
    # 由 journeypilot CLI 在 API 启动前执行。
    "alembic>=1.14",
]

[tool.uv]
package = false

# 增强能力显式安装，核心能力默认可用。
#
# 上面的 `dependencies` 是 **core**：聊天、规划、PostgreSQL/pgvector、Redis、
# MCP、PDF 导出、基础文档导入。下面每一组都是「用户选了才需要」的东西，未安装时
# doctor/readiness 明确报降级，不让基础安装承担全部重量。
#
#   uv sync --project backend                                 core（约 300 MB）
#   uv sync --project backend --group local-embedding          + 本地 Qwen Embedding（ONNX，约 +400 MB）
#   uv sync --project backend --group cross-encoder            + BGE Reranker（torch stack，约 +2.5 GB）
#   uv sync --project backend --group dev                      + 测试与 lint
#
[dependency-groups]
# embedding.provider = "qwen3"（默认）需要这一组。未安装时 embedding 只能走
# provider="openai"（远程）或 "hash"（零依赖、语义质量低）。
local-embedding = [
    "onnxruntime>=1.20.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.26.0",
    "numpy>=1.26.0",
]
# rerank.provider = "cross_encoder" 才需要。默认 provider="llm" 复用已有模型，不依赖 torch。
cross-encoder = [
    "sentence-transformers>=5.5.1",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    # 卡住的测试在 timeout 内失败并指明是哪一个，而不是拖到 CI job 的时间上限。
    "pytest-timeout>=2.3.1",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
# 后端不作为包安装，测试直接导入相邻源码。
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# 单个测试的上限。正常测试都在秒级，120s 只用来把「卡死」和「慢」区分开。
timeout = 120
markers = [
    "postgres: requires a reachable PostgreSQL instance (skipped when absent)",
]

# lint 门禁只启用 E/F：一次开启过多规则会产生无法审阅的 diff，并淹没真正的问题。
[tool.ruff]
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F"]
# 行长度（E501）不纳入门禁，保持 diff 聚焦。
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# scripts 下的入口脚本先把相邻 backend 包加入 sys.path，再导入它。
"**/scripts/*.py" = ["E402"]
